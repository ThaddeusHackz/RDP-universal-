name: THADD OS Desktop ISO

# Builds the full Debian-live desktop ISO (hybrid BIOS + UEFI, XFCE skinned as a
# Windows 11 / macOS Sequoia fusion, real browsers and tooling from apt) with
# live-build, and attaches it to a Release.  This is the heavyweight sibling of
# thadd-iso.yml, which builds the from-scratch THADD live ISO in pure Python.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "also create a Release with this build"
        type: boolean
        default: false
  push:
    branches: [main, "arena/**"]
    paths:
      - "iso/**"
      - "cloud/**"
      - "desktop/**"
      - ".github/workflows/iso-build.yml"
    tags: ["v*"]

permissions:
  contents: write

jobs:
  live-build:
    name: Build & verify desktop ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: live-build toolchain (Debian 12's own, in a Debian 12 container)
        run: |
          # Ubuntu's live-build is a 2015 snapshot that rejects this config, and
          # THADD OS targets Debian 12 anyway - so the build runs in bookworm.
          docker pull -q debian:bookworm
          docker run --rm debian:bookworm bash -c 'apt-get update -qq >/dev/null && apt-get install -y -qq live-build >/dev/null && lb --version' 

      - name: Build THADD OS (desktop profile)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p dist
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work \
            -e THADD_PROFILE="${THADD_PROFILE:-desktop}" \
            -e THADD_VERSION="${THADD_VERSION:-}" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:bookworm bash -c '
              echo "container: $( . /etc/os-release; echo $PRETTY_NAME ) / debian_version=$(cat /etc/debian_version)"
              apt-get update -qq && apt-get install -y -qq live-build debootstrap xorriso \
                squashfs-tools mtools dosfstools rsync isolinux syslinux-common \
                grub-efi-amd64-bin grub-pc-bin grub-common >/dev/null
              echo "live-build: $(lb --version | head -1)"; echo "live-build package: $(dpkg-query -W -f=\'\${Version}\' live-build 2>/dev/null)"
              bash -x ./iso/build.sh' 2>&1 | tee dist/desktop-build-trace.log
        # A failed desktop build must not stop the live ISO from being released
        # (thadd-iso.yml is what publishes that one).  When this fails, the log
        # tail below is the fastest way to see why in the Actions UI.

      - name: Build log (on failure) - committed so it is readable from anywhere
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs/reports
          {
            echo "# THADD OS desktop ISO - live-build report"
            echo
            echo "- run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- result: **failed**"
            echo
            echo '```'
            echo "== ls dist =="
            ls -la dist/ 2>/dev/null || true
            echo "== ls iso =="
            ls -la iso/ 2>/dev/null | head -20
            echo
            echo "== effective live-build config (iso/config/common) =="
            grep -E '^LB_(DISTRIBUTION|PARENT_DISTRIBUTION|ARCHITECTURE|MIRROR_CHROOT|MIRROR_CHROOT_SECURITY|MIRROR_BINARY|MIRROR_BINARY_SECURITY|BINARY_IMAGE|BOOTLOADERS|INITSYSTEM|DEBOOTSTRAP)=' iso/config/common 2>/dev/null || echo "(no config/common)"
            for f in dist/build.log dist/desktop-build-trace.log iso/*.log /var/log/lb*.log /tmp/lb*.log; do
              [ -f "$f" ] || continue
              echo
              echo "===== $f (first 40 lines) ====="
              head -n 40 "$f"
              echo
              echo "===== $f (last 120 lines) ====="
              tail -n 120 "$f"
            done
            echo
            echo "===== suites and mirrors the build actually contacted ====="
            grep -hoE '(https?://[^ ]+ (bookworm|bullseye|trixie|sid|stable|testing)[^ ]*)' dist/build.log 2>/dev/null | sort -u | head -12 || true
            echo '```'
          } > docs/reports/desktop-iso-build.md
          sed -n '1,40p' docs/reports/desktop-iso-build.md
          # the contents API, not a git push: a CI checkout races every other
          # push and would silently drop the report
          bash scripts/ci/publish-file.sh docs/reports/desktop-iso-build.md \
            "ci: desktop ISO build report [skip ci]"
          echo "::warning::the live-build desktop ISO failed - see docs/reports/desktop-iso-build.md"

      - name: List what we produced
        run: |
          ls -la dist/ || true
          shopt -s nullglob
          isos=(dist/*.iso)
          if (( ${#isos[@]} == 0 )); then
            echo "::warning::live-build produced no ISO in this run"
            exit 0
          fi
          for f in "${isos[@]}"; do
            echo "$f  $(stat -c%s "$f") bytes"
            sha256sum "$f"
          done

      - name: Verify the ISO
        run: |
          if [ -x iso/verify.sh ]; then sudo ./iso/verify.sh; else echo "no verify.sh"; fi

      - uses: actions/upload-artifact@v4
        if: hashFiles('dist/*.iso') != ''
        with:
          name: THADD-OS-desktop-ISO
          path: dist/*.iso
          retention-days: 30

      - name: Publish Release
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && hashFiles('dist/*.iso') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          case "$TAG" in v*) ;; *) TAG="v1.0" ;; esac
          NOTES="dist/README.txt"
          [ -f "$NOTES" ] || printf 'THADD OS desktop live ISO (hybrid BIOS + UEFI).\n' > "$NOTES"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "THADD OS ${TAG#v}" --notes-file "$NOTES"
          gh release upload "$TAG" dist/*.iso --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
