name: THADD tests

# Fast, offline verification of the parts of THADD OS that are pure logic:
# the forensics readers, the ISO builders and the UEFI loader. Runs in well
# under a minute, so it can gate every push.
on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "thadd/**"
      - ".github/workflows/thadd-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Forensics + boot builders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc binutils
          sudo python3 -m pip install --break-system-packages -q pillow pycdlib av imageio-ffmpeg
          python3 -VV

      - name: Compile every Python module
        run: |
          python3 -m compileall -q thadd || (python3 -m compileall thadd; exit 1)

      - name: Forensics readers against known images
        run: python3 thadd/forensics/tests/test_triage.py

      - name: Fetch the kernel for the loader test
        run: |
          mkdir -p build/payload
          curl -fsSL -o build/payload/vmlinuz \
            https://raw.githubusercontent.com/gokrazy/kernel.amd64/main/vmlinuz

      - name: Build the UEFI loader
        run: python3 thadd/boot/build_bootloaders.py

      - name: Loader against both mock firmwares (filesystem and raw blocks)
        run: python3 thadd/boot/tests/run_loader_test.py

      - name: Render the desktop gallery and demo video
        run: |
          python3 - <<'PY'
          from thadd.server import video
          shots = video.render_snapshots("/tmp/snapshots")
          info = video.render_video("/tmp/thadd-os-demo.mp4", width=640, height=360,
                                    seconds_per_scene=0.4)
          print(f"snapshots: {len(shots)}  video: {info['frames']} frames "
                f"{info['seconds']}s via {info['mode']}")
          assert len(shots) >= 30, "the gallery lost scenes"
          # the video must be a real encode (H.264), not the GIF fallback
          assert info.get("mode") in ("pyav-h264", "ffmpeg-h264"), info
          assert info.get("frames", 0) > 100, "the video is too short"
          assert info.get("bytes", 0) > 50_000, "the video looks empty"
          PY
