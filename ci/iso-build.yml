name: THADD OS · ISO build & verify

# =============================================================================
#  Builds the real, bootable THADD OS image from this repository and proves it:
#    1. live-build produces a hybrid BIOS+UEFI ISO from iso/ + os/ + desktop/
#    2. iso/verify.sh reads the boot records and inspects the shipped squashfs
#    3. a chroot into the *extracted image* runs the in-image self-test
#    4. a QEMU smoke boot confirms it actually reaches userspace (best effort)
#    5. the ISO is published to a GitHub Release with checksums
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the ISO to a GitHub Release"
        type: boolean
        default: true
  push:
    branches:
      - "arena/**"
      - main
    paths:
      - "iso/**"
      - "os/**"
      - "desktop/**"
      - "ai/**"
      - "security/**"
      - "tools/**"
      - "scripts/ci/**"
      - ".github/workflows/iso-build.yml"

permissions:
  contents: write

concurrency:
  group: thadd-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  build-iso:
    name: Build the ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      version: ${{ steps.meta.outputs.version }}
      iso_name: ${{ steps.meta.outputs.iso_name }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Install the live-build toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq live-build debootstrap xorriso squashfs-tools mtools dosfstools \
                                     rsync isolinux syslinux-common syslinux-efi grub-efi-amd64-bin \
                                     grub-pc-bin fdisk file
          lb --version | head -1

      - name: Configure git ownership (build fingerprint uses git)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        env:
          THADD_ISO_STRICT: "0"
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" THADD_ISO_STRICT=0 ./iso/build.sh --clean 2>&1 | tail -n 260

      - name: Resolve artefact metadata
        id: meta
        run: |
          ISO=$(ls -1 dist/*.iso | head -1)
          echo "version=$(sed -n 's/^THADD_OS_VERSION=//p' iso/config/includes.chroot/etc/thadd/build-info | head -1)" >> "$GITHUB_OUTPUT"
          echo "iso_name=$(basename "$ISO")" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"

      - name: Verify the ISO (boot records + shipped payload)
        run: ./iso/verify.sh dist/*.iso

      - name: Upload ISO artefact
        uses: actions/upload-artifact@v4
        with:
          name: thadd-os-iso
          path: |
            dist/*.iso
            dist/*.sha256
            dist/RELEASE-NOTES.md
            dist/parts.sha256
            dist/*.part-*
          compression-level: 0
          retention-days: 30

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.publish != false || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-release.sh

  # ---------------------------------------------------------------------------
  verify-inside-image:
    name: Runtime verification inside the built image
    needs: build-iso
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download the ISO we just built
        uses: actions/download-artifact@v4
        with:
          name: thadd-os-iso
          path: artefact

      - name: Install extraction tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools qemu-system-x86 ovmf

      - name: Extract the shipped filesystem
        run: |
          ISO=$(ls -1 artefact/*.iso | head -1)
          mkdir -p rootfs
          xorriso -indev "$ISO" -osirrox on -extract /live/filesystem.squashfs /tmp/fs.squashfs
          sudo unsquashfs -d rootfs /tmp/fs.squashfs >/dev/null
          echo "extracted $(sudo du -sh rootfs | cut -f1)"

      - name: Run the in-image self-test inside the real rootfs
        run: |
          sudo mount --bind /dev  rootfs/dev   || true
          sudo mount -t proc  proc  rootfs/proc  || true
          sudo mount -t sysfs sysfs rootfs/sys   || true
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf || true
          set +e
          sudo chroot rootfs /usr/local/bin/thadd-desktop-selftest --image-build
          rc=$?
          echo "self-test exit code: $rc"
          sudo umount -l rootfs/dev rootfs/proc rootfs/sys 2>/dev/null || true
          exit $rc

      - name: THADD AI offline self-test (no API key required)
        run: |
          sudo chroot rootfs /usr/bin/python3 /opt/thadd/ai/thadd-ai.py --selftest
          sudo chroot rootfs /usr/bin/python3 /opt/thadd/ai/test_ai.py

      - name: QEMU smoke boot (best effort — proves the ISO reaches userspace)
        continue-on-error: true
        run: |
          ISO=$(ls -1 artefact/*.iso | head -1)
          sudo apt-get install -y -qq expect || true
          timeout 420 qemu-system-x86_64 -m 3072 -smp 2 -cdrom "$ISO" \
            -boot d -display none -serial file:/tmp/serial.log -no-reboot \
            -netdev user,id=n0 -device e1000,netdev=n0 -daemonize -pidfile /tmp/qemu.pid || true
          for i in $(seq 1 40); do
            sleep 10
            if grep -qiE "THADD OS|login:|Reached target" /tmp/serial.log 2>/dev/null; then break; fi
            kill -0 "$(cat /tmp/qemu.pid 2>/dev/null)" 2>/dev/null || break
          done
          sudo kill "$(cat /tmp/qemu.pid 2>/dev/null)" 2>/dev/null || true
          echo "--- serial log tail ---"; tail -n 60 /tmp/serial.log || true
          grep -qiE "THADD OS|login:|Reached target" /tmp/serial.log && echo "✅ image booted to userspace"

      - name: QEMU boot log artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-log
          path: /tmp/serial.log
          if-no-files-found: ignore
          retention-days: 14
