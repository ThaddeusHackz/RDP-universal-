; =============================================================================
;  THADD OS — managed services
;  Every service auto-restarts forever; Railway/Docker healthchecks plus
;  supervisord give THADD OS its self-healing "works forever" behaviour.
; =============================================================================

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autorestart=true
startretries=100
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autorestart=true
startretries=100
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:websockify]
command=/usr/bin/websockify 127.0.0.1:6080 127.0.0.1:5901
autorestart=true
startretries=100
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman -n
autorestart=true
startretries=100
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xrdp]
command=/usr/sbin/xrdp -n
autorestart=true
startretries=100
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
;  THADD Desktop — the always-on persistent desktop that browsers see.
;  Runs as the THADD user on X display :1, rendered by TigerVNC and streamed
;  to the web by websockify → nginx (noVNC).
; ---------------------------------------------------------------------------
; Continuously proves THIS deployed instance accepts the credentials
; (pamtester accept/reject + listeners + PAM/xrdp.ini audit) and publishes
; the verdict to /api/login-probe so a broken login can never be silent.
[program:login-probe]
command=/opt/thadd/login-probe.sh
autorestart=true
startretries=100
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:thadd-desktop]
command=/opt/thadd/run-vnc.sh
user=%(ENV_THADD_USER)s
environment=HOME="/home/%(ENV_THADD_USER)s",USER="%(ENV_THADD_USER)s",RESOLUTION="%(ENV_RESOLUTION)s",XDG_RUNTIME_DIR="/tmp/xdg-%(ENV_THADD_USER)s"
autorestart=true
autostart=true
startretries=100
startsecs=5
stopasgroup=true
killasgroup=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
