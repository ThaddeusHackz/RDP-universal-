; =============================================================================
;  THADD OS — supervisor master config
;  One supervisor tree rules them all: nginx, websockify, xrdp, the persistent
;  browser desktop (Xvnc) and the system D-Bus.
; =============================================================================
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/tmp
user=root

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
