-- THADD OS — desktop HUD (conky)
conky.config = {
    alignment = 'bottom_right',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = '9fb3d1',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    gap_x = 42,
    gap_y = 120,
    minimum_width = 280,
    no_buffers = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    stippled_borders = 0,
    update_interval = 1,
    use_xft = true,
    font = 'Inter:size=9',
    xftalpha = 0.9,
    uppercase = false,
    format_human_readable = true,
    color0 = 'ff79c6',
    color1 = '50fa7b',
    color2 = '8be9fd',
    color3 = 'f8f8f2',
    color4 = 'bd93f9',
};

conky.text = [[
${font JetBrains Mono:bold:size=12}${color2}THADD OS${font}${color3}  ${alignr}${uptime_short} up
${color2}${voffset 4}┌─${color3} SYSTEM${voffset -4}
${color2}├─${color3} CPU  ${color1}${cpu}%${color3}   ${color4}${cpubar 8,150}
${color2}├─${color3} RAM  ${color1}${memperc}%${color3}   ${color4}${membar 8,150}
${color2}├─${color3} SWAP ${color1}${swapperc}%${color3}
${color2}├─${color3} DISK ${color1}${fs_used_perc /}%${color3}   ${color4}${fs_bar 8,150 /}
${color2}├─${color3} LOAD ${color1}${loadavg 1}
${color2}├─${color3} TOP  ${color1}${top name 1}${color3} ${alignr}${top cpu 1}%
${color2}├─${color3}      ${color1}${top name 2}${color3} ${alignr}${top cpu 2}%
${color2}└─${color3} KRNL ${color1}${kernel}
]];
