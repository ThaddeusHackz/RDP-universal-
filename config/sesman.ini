[Globals]
; THADD OS — xrdp-sesman (Debian 12 / xrdp 0.9.x)
ListenAddress=127.0.0.1
ListenPort=3350
EnableUserWindowManager=true
UserWindowManager=startwm.sh
DefaultWindowManager=startwm.sh
ReconnectScript=reconnectwm.sh

[Security]
AllowRootLogin=true
MaxLoginRetry=8
TerminalServerUsers=tsusers
TerminalServerAdmins=tsadmins
; CRITICAL: if this is true and tsusers is empty / user is not a member,
; every correct password is rejected. We create the group and add the user
; at boot, but keep the check off as a safety net.
AlwaysGroupCheck=false
RestrictOutboundClipboard=false
RestrictInboundClipboard=false

[Sessions]
X11DisplayOffset=10
MaxSessions=8
KillDisconnected=false
DisconnectedTimeLimit=0
IdleTimeLimit=0
Policy=Default

[Logging]
LogFile=xrdp-sesman.log
LogLevel=INFO
EnableSyslog=false
SyslogLevel=INFO

[Xorg]
; Kept for completeness; xrdp.ini does not expose this session.
param=/usr/lib/xorg/Xorg
param=-config
param=xrdp/xorg.conf
param=-noreset
param=-nolisten
param=tcp
param=-logfile
param=.xorgxrdp.%s.log

[Xvnc]
param=Xvnc
param=-bs
param=-nolisten
param=tcp
param=-localhost
param=-dpi
param=96
