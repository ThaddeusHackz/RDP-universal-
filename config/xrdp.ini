[Globals]
; THADD OS — xrdp 0.9.x (Debian 12) configuration
; Tuned so Microsoft Remote Desktop / FreeRDP / Remmina can log in with the
; system username + password (THADD_USER / THADD_PASSWORD).
ini_version=1
fork=false
port=3389
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true
security_layer=tls
crypt_level=high
certificate=/etc/xrdp/cert.pem
key_file=/etc/xrdp/key.pem
ssl_protocols=TLSv1.2, TLSv1.3
; Skip the session dropdown — Xorg is NOT installed (no xorgxrdp). Picking it
; is the #1 reason a correct password still ends in "some problem".
autorun=Xvnc
allow_channels=true
allow_multimon=true
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=32
new_cursors=true
use_fastpath=both

; Branded login window (dark, matches the THADD portal)
ls_top_window_bg_color=05070d
ls_width=350
ls_height=360
ls_bg_color=0b1220
ls_logo_filename=
ls_logo_x_pos=55
ls_logo_y_pos=35
ls_label_x_pos=30
ls_label_width=65
ls_input_x_pos=110
ls_input_width=210
ls_input_y_pos=158
ls_btn_ok_x_pos=142
ls_btn_ok_y_pos=290
ls_btn_ok_width=85
ls_btn_ok_height=30
ls_btn_cancel_x_pos=237
ls_btn_cancel_y_pos=290
ls_btn_cancel_width=85
ls_btn_cancel_height=30

[Logging]
LogFile=xrdp.log
LogLevel=INFO
EnableSyslog=false
SyslogLevel=INFO

[Channels]
rdpdr=true
rdpsnd=true
drdynvc=true
cliprdr=true
rail=true
xrdpvr=true
tcutils=true

; ---------------------------------------------------------------------------
;  ONLY backend: sesman-spawned TigerVNC. port=-1 means "ask sesman to
;  PAM-authenticate this user, start Xvnc, hand back the port".
;  delay_ms gives Xvnc time to bind before libvnc.so connects — without it
;  a successful PAM login still dies with "problem connecting".
; ---------------------------------------------------------------------------
[Xvnc]
name=Xvnc
lib=libvnc.so
username=ask
password=ask
ip=127.0.0.1
port=-1
xserverbpp=24
delay_ms=2000
